<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SongHub Songbook (social card)</title>
<style>
@font-face{font-family:Inter;src:url(Inter-latin.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;width:1200px;height:630px;background:#0E0F14;font-family:Inter,sans-serif;overflow:hidden}
.card{width:1200px;height:630px;box-sizing:border-box;padding:0 96px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.brand{display:flex;align-items:center;gap:28px}
.brand svg{width:144px;height:144px;fill:#FFC933;flex:none}
.word{font-size:84px;line-height:1;color:#F4F5F8;font-weight:800;letter-spacing:-0.02em;white-space:nowrap}
.word span{font-weight:400;color:#A9AEBD}
.tag{font-size:48px;line-height:1.2;font-weight:600;color:#FFC933}
.sub{font-size:30px;line-height:1.3;font-weight:400;color:#A9AEBD}
</style></head><body><div class="card">
<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="18.5" r="3"/><circle cx="17" cy="16.5" r="3"/><path d="M8 6h2v12.5H8zM18 3.8h2v12.7h-2z"/><path d="M8 6.2 20 3.8v3.9L8 10.1z"/></svg><div class="word">SongHub<span> Songbook</span></div></div>
<div><div class="tag">Find your song number</div><div class="sub">Search karaoke songs by title or artist</div></div>
</div></body></html>
